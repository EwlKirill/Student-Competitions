# The merge gate: every pull request against `main` runs the same verification the release runs.
# Contract: specs/002-public-deploy-cicd/contracts/pipeline.md#ciyml--the-merge-gate.
#
# Reporting a failure is not the same as preventing a merge — branch protection requiring the
# `checks / quality` and `checks / image` contexts is what makes this a gate (FR-016). Apply it
# with scripts/setup_branch_protection.sh.
name: CI

on:
  pull_request:
    branches: [main]
    # `synchronize` is what re-runs verification when new commits are pushed to the pull
    # request (FR-015).
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # One group per pull request: a new push supersedes the run for the commit it replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
