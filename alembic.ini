# Alembic configuration: where the migrations live and how new revision files are named.
# Rationale: specs/003-database-questions/research.md#d14 (housekeeping) and #d3 (configuration).
#
# There is deliberately no `sqlalchemy.url` here. The database location comes from
# `resolve_database_url` in `app/core/config.py`, called by `migrations/env.py`, so the
# application and its migrations always target the same database and no URL is ever committed.

[alembic]
script_location = %(here)s/migrations

# Files sort by date: 2026_09_24_3f2a9c1b7d4e_create_questions_and_boot_counter.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# The project root, so `migrations/env.py` can import the `app` package.
prepend_sys_path = %(here)s

# Dates in revision headers are UTC, like every timestamp the application stores.
timezone = UTC

path_separator = os

[post_write_hooks]
# Generated revisions are formatted and linted before anyone reads them, so an autogenerated
# file never fails CI on style.
hooks = ruff_format, ruff_check

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

# Logging for the `alembic` command line. `migrations/env.py` applies it without disabling the
# loggers that already exist, so running Alembic from the tests leaves the application's logging
# alone.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
