# Render Blueprint: the hosting side of the milestone, as code.
# Contract: specs/002-public-deploy-cicd/contracts/render-service.md — rationale: research D1–D3.
#
# `region` is immutable after creation: changing it means a new service and a new public address.
# One secret, the production database URL, is declared below by key only (`sync: false`): its
# value is entered once in the Render dashboard and is never committed (milestone 3 FR-032).
# The database itself is on Neon, not Render, so there is no `databases:` block here
# (specs/003-database-questions/research.md#d1).
services:
  - type: web
    name: student-competitions
    runtime: docker
    plan: free
    # The only branch Render will ever build. Combined with auto-deploy being off, a push to any
    # other branch can publish nothing (FR-022).
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Traffic is switched to a new instance only once this returns 2xx, and 60s of consecutive
    # failures restarts the instance (FR-006, FR-023).
    healthCheckPath: /healthz
    region: frankfurt
    # Custom domain, bought on NIC.UA; its DNS records (A @ → 216.24.57.1, CNAME www → the
    # onrender.com hostname) are managed there, not here.
    # Render adds www.brainring.org.ua automatically and redirects it to the root domain. The
    # onrender.com address keeps working until `renderSubdomainPolicy: disabled` is set.
    domains:
      - brainring.org.ua
    # Quoted deliberately: YAML 1.1 parses a bare `off` as the boolean false. The pipeline
    # (.github/workflows/deploy.yml) is the only thing that deploys this service (FR-020, FR-021).
    autoDeployTrigger: "off"
    envVars:
      # PORT is supplied by Render and RENDER_GIT_COMMIT is set automatically; HOST is stated
      # explicitly so the bind address is visible rather than implied.
      - key: HOST
        value: 0.0.0.0
      # Neon's direct (non-pooled) connection string, entered once in Render → service →
      # Environment (specs/003-database-questions/quickstart.md, step N2). `sync: false` declares
      # the key without a value. Without it the service refuses to start rather than fall back to
      # a throw-away SQLite file inside the container.
      - key: DATABASE_URL
        sync: false
